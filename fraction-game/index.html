
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractions Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .game {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    h1 {
      color: #3346a0;
      margin-top: 0;
    }

    .score {
      color: #667085;
      margin: 16px 0;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 36px;
      font-weight: bold;
      margin: 24px;
    }

    .fraction span:first-child {
      border-bottom: 3px solid #222;
      padding: 0 14px 6px;
    }

    .fraction span:last-child {
      padding-top: 6px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      padding: 16px;
      border: 2px solid #dce2fa;
      background: #f7f8ff;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .option:hover:not(:disabled) {
      background: #e8edff;
    }

    .option:disabled {
      cursor: default;
    }

    .correct {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .incorrect {
      background: #fee2e2;
      border-color: #dc2626;
    }

    #feedback {
      min-height: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    #next {
      background: #4356cb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🎯 Fractions Challenge</h1>
    <p>Select the fraction equivalent to the one shown.</p>

    <p class="score">
      Question <span id="questionNumber">1</span> of 5
      | Score: <span id="score">0</span>
    </p>

    <div class="fraction" aria-label="Question fraction">
      <span id="numerator">1</span>
      <span id="denominator">2</span>
    </div>

    <div id="options" class="options"></div>

    <p id="feedback" aria-live="polite"></p>

    <button id="next" disabled>Next Question →</button>
  </main>

  <script>
    const questions = [
      {
        numerator: 1,
        denominator: 2,
        options: ["2/4", "1/3", "3/5", "2/5"],
        answer: "2/4"
      },
      {
        numerator: 2,
        denominator: 3,
        options: ["2/6", "4/6", "3/4", "1/2"],
        answer: "4/6"
      },
      {
        numerator: 3,
        denominator: 4,
        options: ["3/8", "2/4", "6/8", "4/6"],
        answer: "6/8"
      },
      {
        numerator: 1,
        denominator: 3,
        options: ["2/3", "3/6", "2/6", "1/4"],
        answer: "2/6"
      },
      {
        numerator: 2,
        denominator: 5,
        options: ["4/10", "3/5", "2/10", "5/10"],
        answer: "4/10"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const optionsContainer = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next");

    function showQuestion() {
      answered = false;
      const question = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

      document.getElementById("numerator").textContent =
        question.numerator;

      document.getElementById("denominator").textContent =
        question.denominator;

      document.getElementById("score").textContent = score;

      feedback.textContent = "";
      optionsContainer.innerHTML = "";
      nextButton.disabled = true;

      question.options.forEach(option => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;

        button.addEventListener("click", () => {
          checkAnswer(option, button);
        });

        optionsContainer.appendChild(button);
      });
    }

    function checkAnswer(selected, button) {
      if (answered) return;

      answered = true;
      const correctAnswer = questions[currentQuestion].answer;

      if (selected === correctAnswer) {
        score++;
        button.classList.add("correct");
        feedback.textContent = "✅ Correct! Well done!";
        feedback.style.color = "#15803d";
      } else {
        button.classList.add("incorrect");
        feedback.textContent =
          "❌ Not quite! The answer is " + correctAnswer;
        feedback.style.color = "#b91c1c";
      }

      document.getElementById("score").textContent = score;

      optionsContainer.querySelectorAll("button").forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === correctAnswer) {
          btn.classList.add("correct");
        }
      });

      nextButton.disabled = false;

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "See Results →";
      }
    }

    nextButton.addEventListener("click", () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      document.querySelector(".game").innerHTML = `
        <h1>🎉 Challenge Complete!</h1>
        <p>You scored</p>
        <h2>${score} / ${questions.length}</h2>
        <p>Keep practising your fraction skills!</p>
        <button id="next" onclick="location.reload()">
          Play Again ↻
        </button>
      `;
    }

    showQuestion();
  </script>
</body>
</html>
