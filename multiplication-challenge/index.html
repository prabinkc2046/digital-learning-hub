
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f0f6ff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px #1f3d6715;
    }

    h1 {
      color: #3048a5;
      margin-top: 0;
    }

    .subtitle {
      color: #64748b;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      margin: 28px 0 12px;
      font-weight: bold;
      color: #475569;
    }

    .progress-track {
      background: #e2e8f0;
      height: 9px;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      background: #5268dc;
      width: 0%;
      height: 100%;
      transition: width 0.3s ease;
    }

    .question {
      font-size: 48px;
      font-weight: bold;
      margin: 36px 0;
      color: #1e293b;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      border: 2px solid #dbe4f5;
      background: #f8faff;
      padding: 20px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .answer:hover:not(:disabled) {
      background: #e5edff;
    }

    .answer.correct {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .answer.wrong {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .answer:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 28px;
      margin: 24px 0;
      font-weight: bold;
      font-size: 17px;
    }

    .next {
      background: #5268dc;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    .result-score {
      font-size: 56px;
      font-weight: bold;
      color: #5268dc;
      margin: 25px 0;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>✖️ Multiplication Challenge</h1>
    <p class="subtitle">Test your times tables knowledge!</p>

    <div id="gameArea">
      <div class="progress">
        <span id="questionCount">Question 1 of 10</span>
        <span id="score">Score: 0</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question" id="question"></div>

      <div class="answers" id="answers"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <button class="next" id="nextButton" disabled>
        Next Question →
      </button>
    </div>
  </main>

  <script>
    const totalQuestions = 10;

    let questionNumber = 0;
    let score = 0;
    let correctAnswer = 0;
    let answered = false;

    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      answered = false;
      questionNumber++;

      const a = randomNumber(2, 12);
      const b = randomNumber(2, 12);

      correctAnswer = a * b;

      questionElement.textContent = `${a} × ${b} = ?`;

      document.getElementById("questionCount").textContent =
        `Question ${questionNumber} of ${totalQuestions}`;

      document.getElementById("score").textContent =
        `Score: ${score}`;

      document.getElementById("progressFill").style.width =
        `${((questionNumber - 1) / totalQuestions) * 100}%`;

      feedbackElement.textContent = "";
      answersElement.innerHTML = "";
      nextButton.disabled = true;

      nextButton.textContent =
        questionNumber === totalQuestions
          ? "See Results →"
          : "Next Question →";

      const options = new Set([correctAnswer]);

      while (options.size < 4) {
        const wrongAnswer = correctAnswer +
          randomNumber(-15, 15);

        if (wrongAnswer > 0) {
          options.add(wrongAnswer);
        }
      }

      const shuffledOptions = [...options].sort(
        () => Math.random() - 0.5
      );

      shuffledOptions.forEach(option => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = option;

        button.addEventListener("click", () => {
          checkAnswer(option, button);
        });

        answersElement.appendChild(button);
      });
    }

    function checkAnswer(selectedAnswer, selectedButton) {
      if (answered) return;

      answered = true;

      if (selectedAnswer === correctAnswer) {
        score++;
        selectedButton.classList.add("correct");
        feedbackElement.textContent = "✅ Correct! Great work!";
        feedbackElement.style.color = "#15803d";
      } else {
        selectedButton.classList.add("wrong");
        feedbackElement.textContent =
          `❌ The correct answer is ${correctAnswer}.`;
        feedbackElement.style.color = "#b91c1c";
      }

      document.getElementById("score").textContent =
        `Score: ${score}`;

      answersElement.querySelectorAll("button").forEach(button => {
        button.disabled = true;

        if (Number(button.textContent) === correctAnswer) {
          button.classList.add("correct");
        }
      });

      nextButton.disabled = false;
    }

    function showResults() {
      document.getElementById("progressFill").style.width = "100%";

      document.getElementById("gameArea").innerHTML = `
        <h2>🎉 Challenge Complete!</h2>
        <p>Your final score:</p>
        <div class="result-score">${score} / ${totalQuestions}</div>
        <p>Keep practising your multiplication skills!</p>
        <button class="next" onclick="location.reload()">
          Play Again ↻
        </button>
      `;
    }

    nextButton.addEventListener("click", () => {
      if (questionNumber < totalQuestions) {
        generateQuestion();
      } else {
        showResults();
      }
    });

    generateQuestion();
  </script>
</body>
</html>
